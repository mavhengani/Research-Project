defaults: ../base.yaml
model: bilstm
task: sentiment
data:
  annotations: data/annotations/combined_adjudicated_v2.jsonl
  split_dir: data/processed/combined_v2
bilstm:
  embedding_dim: 100
  hidden_dim: 128
  num_layers: 1
  dropout: 0.3
  use_aspect_pooling: true
train:
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  early_stopping_patience: 5
  class_weighted_loss: true
  device: cuda
